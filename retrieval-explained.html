<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why our retrieval improved — one step at a time</title>
<style>
:root{color-scheme:dark;--bg:#121c27;--panel:#192736;--card:#213345;--ink:#eef3f9;--muted:#b0c1d2;--line:#3a4d60;--blue:#8ebdff;--green:#98e2bf;--amber:#f1ce85;--red:#ffb4b0;--serif:Georgia,"Times New Roman",serif;--sans:"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid var(--amber);outline-offset:5px}button:disabled{opacity:.35;cursor:default}main{max-width:1120px;margin:auto;padding:30px 28px 45px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.top span{font-size:13px;color:var(--muted)}.top strong{font-size:15px;font-weight:600}.steps{display:flex;gap:8px;margin-bottom:30px}.steps button{height:7px;flex:1;border:0;padding:0;background:var(--line);border-radius:3px}.steps button[aria-current=step]{background:var(--green)}.steps button.past{background:#6889a7}.kicker{font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--green);text-transform:uppercase;margin:0 0 7px}h1{font:normal clamp(30px,4.1vw,49px)/1.15 var(--serif);letter-spacing:-.025em;margin:0 0 14px;max-width:900px}.intro{color:var(--muted);margin:0 0 25px;max-width:830px;font-size:18px}.question{padding:14px 20px;border-left:3px solid var(--blue);background:var(--panel);margin-bottom:22px;display:flex;gap:15px;align-items:baseline}.question span{font-size:13px;color:var(--muted);white-space:nowrap}.question strong{font-weight:500}.scene{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:clamp(19px,3vw,32px);min-height:340px}.scene h2{font-size:17px;margin:0 0 18px;font-weight:600}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.piece{border:1px solid var(--line);border-radius:9px;padding:17px 18px;background:var(--card);position:relative;min-width:0}.piece p{margin:0;font-size:16px}.piece small{display:block;color:var(--muted);font-size:12px;margin-bottom:9px}.piece.target{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}.piece.target small{color:var(--green)}.piece .tag{display:inline-block;font-size:12px;padding:3px 8px;border-radius:5px;background:#304960;color:var(--blue);margin-bottom:10px}.piece.target .tag{background:#264c43;color:var(--green)}.piece.removed{opacity:.55;border-style:dashed}.piece.removed p{text-decoration:line-through;text-decoration-color:var(--muted)}.ghost-lines{display:block;margin-top:15px;height:18px;background:linear-gradient(var(--line),var(--line)) left top/90% 2px no-repeat,linear-gradient(var(--line),var(--line)) left center/75% 2px no-repeat,linear-gradient(var(--line),var(--line)) left bottom/83% 2px no-repeat;opacity:.7}.arrow-note{text-align:center;padding:20px 0;color:var(--blue);font-weight:600}.arrow-note span{color:var(--muted);font-weight:400;font-size:14px;display:block;margin-top:3px}.reading{margin-top:22px;font-size:14px;color:var(--muted);max-width:830px}.reading strong{color:var(--ink);font-weight:500}.lesson{border-left:3px solid var(--green);padding:3px 0 3px 18px;margin:24px 0 0;font-size:20px;max-width:900px}.lesson span{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin-bottom:5px}.nav{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:28px}.nav button{border:1px solid var(--line);border-radius:8px;padding:10px 20px;color:var(--ink);background:var(--panel)}.nav button.next{background:var(--green);color:#142a24;border-color:var(--green);font-weight:600}.nav .count{font-size:13px;color:var(--muted)}.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:17px}.legend i{display:inline-block;width:9px;height:9px;border:1px solid var(--green);border-radius:2px;margin-right:6px}.legend i.dash{border-color:var(--muted);border-style:dashed}.answer{max-width:650px;margin:35px auto;text-align:center}.answer .quote{font:normal clamp(24px,4vw,37px)/1.4 var(--serif);color:var(--green);margin:15px 0}.answer p{color:var(--muted);font-size:15px}.answer .pill{font-size:12px;color:var(--green);border:1px solid var(--green);border-radius:30px;padding:5px 12px;display:inline-block}.result-label{display:flex;justify-content:space-between;gap:15px;margin-bottom:8px;font-size:16px}.result-label strong{color:var(--green);font-variant-numeric:tabular-nums;font-size:22px}.bar{height:17px;background:var(--card);border-radius:3px;overflow:hidden}.bar span{display:block;height:100%;background:var(--blue)}.result-row{margin:20px 0}.result-row:last-of-type .bar span{background:var(--green)}.scope{font-size:13px;color:var(--muted);margin:0 0 24px}.scale{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.source{font-size:12px;color:var(--muted);margin-top:25px}.source a{color:var(--muted)}.notice{font-size:12px;color:var(--amber);margin:22px 0 0}.flow{display:grid;grid-template-columns:minmax(0,1fr) 42px minmax(0,1fr);gap:14px;align-items:center}.flow .connector{text-align:center;color:var(--blue);font-size:30px}.flow .piece{min-height:120px;display:flex;flex-direction:column;justify-content:center}.flow .piece.center{text-align:center}.flow .second{grid-column:1}.flow .source-piece{grid-column:3;grid-row:1 / span 2;align-self:stretch}.flow .return{font-size:13px;color:var(--muted);margin-top:17px}.contribution{text-align:center;border-top:1px solid var(--line);padding-top:16px;margin-top:22px;font-size:17px}.contribution strong{color:var(--amber)}.miss{display:grid;grid-template-columns:1fr 1fr;gap:18px}.miss h3{font-size:16px;margin:0 0 12px}.miss .piece{height:100%}.miss .good{color:var(--green)}.miss .bad{color:var(--red)}.big-result{font:normal 38px var(--serif);margin:16px 0 8px}.small{font-size:14px;color:var(--muted)}.finish{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:14px}.finish p{margin:0;font-size:15px}.finish strong{color:var(--green)}.hidden{display:none!important}
@media(max-width:720px){main{padding:22px 17px 30px}.cards{grid-template-columns:1fr 1fr}.question{display:block}.question span{display:block;margin-bottom:4px}.scene{min-height:0}.flow{grid-template-columns:minmax(0,1fr) 25px minmax(0,1fr);gap:8px}.flow .piece{padding:13px}.miss,.finish{grid-template-columns:1fr}.top strong{max-width:65%}.nav button{padding:10px 15px}.intro{font-size:16px}.lesson{font-size:18px}.piece p{font-size:15px}}@media(max-width:430px){.cards{grid-template-columns:1fr}.piece{padding:14px}.ghost-lines{display:none}.flow{grid-template-columns:1fr}.flow .source-piece,.flow .second{grid-column:auto;grid-row:auto}.flow .connector{font-size:22px}.flow .second{margin-top:9px}.flow .source-piece{min-height:150px}.top span{font-size:11px}.count{display:none}}@media(prefers-reduced-motion:no-preference){.piece,.bar span{transition:background-color .15s ease}}@media print{body{background:white;color:black}.top,.steps,.nav{display:none}.scene{background:white;border-color:#777}.intro,.reading,.scope,.small{color:#333}}
</style>
</head>
<body>
<main>
  <header class="top"><strong>Why our retrieval improved</strong><span>One idea per screen · works offline</span></header>
  <nav class="steps" aria-label="Walkthrough stages"></nav>
  <section id="stage" aria-live="polite" aria-atomic="true"></section>
  <footer class="nav"><button id="back" type="button">← Back</button><span class="count" id="count"></span><button id="next" class="next" type="button">Next →</button></footer>
  <p class="source">The example contract below is invented for explanation. The measured results come from our saved experiment. <a href="ontology/experiments/llm100-v1/comparison-v1/results.md">Open the detailed results</a>.</p>
  <noscript><p>This walkthrough needs JavaScript to switch stages. No internet or server is needed.</p></noscript>
</main>
<script>
'use strict';
// Illustrative text and layout. These cards are NOT actual retrieved results or rankings.
const question = 'How long can this contract renew for?';
const pieces = [
  {id:'records',text:'Customer records are kept for two years.',category:'Other text'},
  {id:'initial',text:'The initial agreement lasts three years.',category:'Initial term'},
  {id:'renewal',text:'If both parties agree, the contract renews for one year.',category:'Renewal'},
  {id:'price',text:'Prices are reviewed each year.',category:'Other text'},
  {id:'ending',text:'A serious breach can allow either party to end the agreement.',category:'Termination'},
  {id:'delivery',text:'Deliveries take place every month.',category:'Other text'}
];
const stages = [
  {label:'The goal',title:'We need the right passage.',intro:'Before a system can answer a question, it needs to find the text that supports the answer.',
   scene:()=>`<div class="answer"><span class="pill">The passage we need</span><p class="quote">“If both parties agree, the contract renews for one year.”</p><p>The answer’s length and its condition are both here.</p></div>`,
   lesson:'Our experiment measured how much required evidence the search found.',note:'We supplied the correct contract to every method. We were searching inside it.'},
  {label:'1 · Normal RAG',title:'Search all the chunks.',intro:'We cut the contract into pieces. Similarity search tries to find pieces that match the question’s meaning.',
   scene:()=>`<h2>All these pieces can compete for the limited results</h2><div class="cards">${pieces.map(p=>card(p,{chunk:true})).join('')}</div><div class="legend"><span><i></i>Passage we need</span></div>`,
   lesson:'Related words can appear in passages that do not answer the question.',note:'“Two years”, “three years” and “each year” all describe time. Similarity search still has to choose the right context.'},
  {label:'2 · Clause catalogue',title:'Search a smaller, selected collection.',intro:'Before search, a local AI selected passages about the contract’s term, renewal and termination. We searched those passages instead of all the chunks.',
   scene:()=>`<h2>Keep passages about term, renewal and termination</h2><div class="cards">${pieces.map(p=>card(p,{removed:!['initial','renewal','ending'].includes(p.id)})).join('')}</div><div class="arrow-note">Similarity search now searches the selected passages<span>Grey passages still exist in the contract. They are outside this search collection.</span></div>`,
   lesson:'We reduced the material competing with the evidence we need.',note:'This also changed passage boundaries. It was not just a new database or a stronger search model. Extraction can miss relevant text.'},
  {label:'3 · Ontology retrieval',title:'Choose the useful category first.',intro:'The question asks about renewal. We use that topic to select renewal-related rules, then search the evidence attached to them.',
   scene:()=>`<h2>Question topic: renewal → search renewal-related passages</h2><div class="cards">${pieces.filter(p=>['initial','renewal','ending'].includes(p.id)).map(p=>card(p,{tag:true,removed:p.id!=='renewal'})).join('')}</div><div class="arrow-note">Similarity search runs inside this narrower group<span>Categories narrow the candidates; the same search model still ranks them.</span></div>`,
   lesson:'We told search what kind of clause to look among.',note:'The drawing uses one broad “Renewal” label. The real method included optional renewal, automatic renewal and continuation after expiry.'},
  {label:'4 · The graph check',title:'Did connections bring in more evidence?',intro:'The graph can follow a rule to its supporting text and conditions. We checked whether following those links found any additional passage.',
   scene:()=>`<h2>Why a connection can lead back to text already found</h2><div class="flow"><div class="piece center"><small>Rule</small><p>Renewal lasts one year</p></div><div class="connector" aria-label="supported by">→</div><div class="piece target source-piece"><small>One source passage</small><p>“<u>If both parties agree</u>, the contract renews for one year.”</p><div class="return">Both links lead to this same text.</div></div><div class="piece center second"><small>Condition</small><p>Both parties must agree</p></div><div class="connector" aria-label="supported by">→</div></div><p class="contribution">Real experiment: <strong>0 extra passages</strong> added by relationship traversal.</p>`,
   lesson:'The measured improvement came from selecting and categorizing passages.',note:'This same-passage pattern is illustrated here. The measured zero means this run has not shown an added benefit from graph connections.'},
  {label:'5 · The real result',title:'We found more of the required evidence.',intro:'Now leave the invented example. These are the measured averages from 139 real benchmark questions across 85 contracts.',
   scene:()=>`<h2>Average evidence recall</h2><p class="scope">Same questions · correct contract supplied · same maximum text allowance</p>${resultRow('Search original chunks',43.3)}${resultRow('Search extracted clauses',66.7)}${resultRow('Filter categories, then search',80.9)}<div class="scale"><span>0%</span><span>100% of required evidence</span></div>`,
   lesson:'80.9% means evidence coverage—not 80.9% correct legal answers.',note:'We measured overlap with the benchmark’s evidence passages. No generated answers were evaluated. These are averages, not the percentage of questions answered correctly.'},
  {label:'6 · What to remember',title:'A smaller search can also hide the answer.',intro:'If a relevant passage has the wrong category—or our category choice is too narrow—the filter can remove it before search gets a chance.',
   scene:()=>`<h2>One actual failure · expiry question 733</h2><div class="miss"><div class="piece"><small>Clause catalogue</small><h3>Search all extracted passages</h3><p>The required evidence was available.</p><div class="big-result good">100% recall</div><p class="small">All required benchmark text retrieved.</p></div><div class="piece"><small>Ontology retrieval</small><h3>Select categories, then search</h3><p>The selected categories excluded that evidence.</p><div class="big-result bad">0% recall</div><p class="small">The right passage was filtered out.</p></div></div><div class="finish"><p><strong>What worked:</strong> selecting useful passages and narrowing by category.</p><p><strong>What still needs work:</strong> avoiding missing evidence and reducing extra text.</p></div>`,
   lesson:'Improve the clause selection and categories before building a bigger graph.',note:'Ontology recall was incomplete on 30 of 139 questions. Precision was 11.2%: much of the returned text lay outside the benchmark’s required passage. Graph traversal has not yet demonstrated extra value.'}
];
function card(p,options={}) {
  const classes=['piece',p.id==='renewal'?'target':'',options.removed?'removed':''].filter(Boolean).join(' ');
  return `<div class="${classes}"><small>${options.removed?'Outside this search':p.id==='renewal'?'Passage we need':options.chunk?'Another contract chunk':'Selected passage'}</small>${options.tag?`<span class="tag">${p.category}</span>`:''}<p>${p.text}</p>${options.chunk?'<span class="ghost-lines" aria-hidden="true"></span>':''}</div>`;
}
function resultRow(label,value){return `<div class="result-row"><div class="result-label"><span>${label}</span><strong>${value.toFixed(1)}%</strong></div><div class="bar" aria-hidden="true"><span style="width:${value}%"></span></div></div>`;}
let current=0;
const stage=document.getElementById('stage');
const stepNav=document.querySelector('.steps');
const back=document.getElementById('back');
const next=document.getElementById('next');
stepNav.innerHTML=stages.map((s,i)=>`<button type="button" aria-label="Stage ${i+1}: ${s.label}" title="${s.label}" data-step="${i}"></button>`).join('');
function render(){
  const s=stages[current];
  stage.innerHTML=`<p class="kicker">${s.label}</p><h1 id="stage-title" tabindex="-1">${s.title}</h1><p class="intro">${s.intro}</p>${current<5?`<div class="question"><span>Same example question</span><strong>“${question}”</strong></div>`:''}<div class="scene">${s.scene()}</div><p class="lesson"><span>The one thing to understand</span>${s.lesson}</p><p class="reading">${s.note}</p>${current<5?'<p class="notice">Illustration only: short invented passages. Card positions are not measured search rankings.</p>':''}`;
  back.disabled=current===0;next.textContent=current===stages.length-1?'Start again ↺':'Next →';
  document.getElementById('count').textContent=`${current+1} of ${stages.length}`;
  stepNav.querySelectorAll('button').forEach((button,i)=>{button.classList.toggle('past',i<current);if(i===current)button.setAttribute('aria-current','step');else button.removeAttribute('aria-current');});
}
function go(index){current=Math.max(0,Math.min(stages.length-1,index));render();document.getElementById('stage-title').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}
back.addEventListener('click',()=>go(current-1));next.addEventListener('click',()=>go(current===stages.length-1?0:current+1));
stepNav.addEventListener('click',event=>{const button=event.target.closest('button[data-step]');if(button)go(Number(button.dataset.step));});
document.addEventListener('keydown',event=>{if(event.altKey||event.ctrlKey||event.metaKey||event.target.matches('input,textarea,select'))return;if(event.key==='ArrowRight'&&current<stages.length-1){event.preventDefault();go(current+1);}if(event.key==='ArrowLeft'&&current>0){event.preventDefault();go(current-1);}});
render();
</script>
</body>
</html>
